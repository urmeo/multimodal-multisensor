<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="836" viewBox="0 0 1280 836" role="img" aria-labelledby="pipeline-title pipeline-description" font-family="Arial, Helvetica, sans-serif">
  <title id="pipeline-title">Project pipeline: data, analysis and figures</title>
  <desc id="pipeline-description">Two independent data paths. Eye and cardiac recordings, raw questionnaire answers and response times are checked for values, timing and quality, then summarized as samples and candidate eye events. Released group tables contain ten adults across three sessions. Their rows and known repeats are checked before ICC, Spearman correlations, paired tests and exploratory duration clustering. Both paths produce plots and tables. Most group rows cannot be rebuilt from available recordings. Optional question summaries require acquisition timezone metadata; sensor joins and clustering also require confirmed clock synchronization. K-means uses standardized features, and PCA supplies a display. Tests, all 33 notebooks and source hashes check the analyses. Outputs use separate files, preserving source data. Results are descriptive; eye events and clusters are exploratory.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#55C4E0"/>
    </marker>
    <style>
      .title { fill: #E7EDED; font-size: 32px; font-weight: 600; }
      .subtitle { fill: #B8C5CC; font-size: 21px; }
      .stage { fill: #A8B5BD; font-size: 17px; font-weight: 600; letter-spacing: 1px; }
      .card { fill: #1B2327; stroke: #667A85; stroke-width: 1.5; }
      .analysis { stroke: #55C4E0; }
      .heading { fill: #E7EDED; font-size: 26px; font-weight: 600; }
      .body { fill: #B8C5CC; font-size: 22px; }
      .note { fill: #A8B5BD; font-size: 19px; }
      .flow { fill: none; stroke: #55C4E0; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="836" fill="#14191C"/>
  <text x="48" y="52" class="title">PROJECT PIPELINE</text>
  <text x="48" y="86" class="subtitle">Recordings and released group tables follow separate paths.</text>
  <path d="M48 108H1232" stroke="#45545D" stroke-width="1.5"/>

  <text x="48" y="138" class="stage">01  DATA</text>
  <text x="462" y="138" class="stage">02  CHECK + ANALYSE</text>
  <text x="876" y="138" class="stage">03  PLOTS + TABLES</text>

  <!-- Recording path. -->
  <rect x="48" y="158" width="356" height="160" rx="8" class="card"/>
  <text x="70" y="196" class="heading">Recordings + responses</text>
  <text x="70" y="238" class="body">Eye + cardiac readings</text>
  <text x="70" y="268" class="body">Raw answers + response times</text>

  <rect x="462" y="158" width="356" height="160" rx="8" class="card analysis"/>
  <text x="484" y="196" class="heading">Summarize recordings</text>
  <text x="484" y="238" class="body">Check values, time + quality</text>
  <text x="484" y="268" class="body">Keep channels + interval gaps</text>
  <text x="484" y="298" class="body">Metrics + eye-event candidates</text>

  <rect x="876" y="158" width="356" height="160" rx="8" class="card"/>
  <text x="898" y="196" class="heading">Recording outputs</text>
  <text x="898" y="238" class="body">Traces + distributions</text>
  <text x="898" y="268" class="body">Event plots + response tables</text>
  <path d="M414 238H452" class="flow"/>
  <path d="M828 238H866" class="flow"/>

  <!-- Group tables enter independently of the recording path. -->
  <rect x="48" y="352" width="356" height="160" rx="8" class="card"/>
  <text x="70" y="390" class="heading">Released group tables</text>
  <text x="70" y="432" class="body">10 adults × 3 sessions</text>
  <text x="70" y="462" class="body">Interval, pupil + response</text>
  <text x="70" y="492" class="body">Standard deviations</text>

  <rect x="462" y="352" width="356" height="160" rx="8" class="card analysis"/>
  <text x="484" y="390" class="heading">Compare sessions</text>
  <text x="484" y="432" class="body">Check rows + known repeats</text>
  <text x="484" y="462" class="body">ICC, Spearman + paired tests</text>
  <text x="484" y="492" class="body">Explore duration clusters</text>

  <rect x="876" y="352" width="356" height="160" rx="8" class="card"/>
  <text x="898" y="390" class="heading">Group outputs</text>
  <text x="898" y="432" class="body">Reliability + 95% intervals</text>
  <text x="898" y="462" class="body">Correlation heatmap + tables</text>
  <path d="M414 432H452" class="flow"/>
  <path d="M828 432H866" class="flow"/>

  <text x="48" y="546" class="note">Most group rows cannot be rebuilt from the released recordings.</text>

  <!-- These are separate metadata requirements, not consecutive steps. -->
  <rect x="48" y="574" width="1184" height="112" rx="8" fill="#1B2327" stroke="#F08B79" stroke-width="1.5"/>
  <text x="70" y="604" fill="#F08B79" font-size="20" font-weight="600">OPTIONAL · REQUIRES ACQUISITION CLOCK METADATA</text>
  <text x="70" y="638" class="subtitle">Known timezone → question summaries</text>
  <text x="70" y="668" class="subtitle">Known timezone + confirmed clock sync → sensor joins + exploratory clusters</text>
  <text x="48" y="718" class="note">Clustering uses standardized features. PCA is only for display.</text>

  <rect x="48" y="744" width="1184" height="72" rx="8" fill="#1B2327" stroke="#45545D" stroke-width="1"/>
  <text x="70" y="771" fill="#E7EDED" font-size="22" font-weight="600">Verify: tests + all 33 notebooks + source hashes</text>
  <text x="70" y="795" class="note">Export separate files and preserve the source data.</text>
</svg>
