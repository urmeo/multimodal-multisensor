[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mms"
version = "1.0.1"
description = "Shared analysis code for the Multimodal-Multisensor longitudinal study"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "urme" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "pytz>=2020.1",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbmake>=1.5", "ipykernel>=6.25"]
notebooks = ["jupyterlab>=4.6.4"]
docs = ["mistune==3.3.3"]

[tool.setuptools.packages.find]
include = ["mms*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
