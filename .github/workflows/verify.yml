name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLCONFIGDIR: /tmp/mms-mpl
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  LOKY_MAX_CPU_COUNT: 2

jobs:
  test:
    name: Validate data & notebooks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,docs]'
      - run: python -m pytest tests -q
      - run: python -m scripts.build_group_summaries --check
      - run: python scripts/build_figures.py --check
      - run: python -m scripts.build_recording_figures --check
      - run: python -m scripts.build_group_sensitivity --check
      - run: python scripts/verify_notebooks.py

  locked:
    name: Reproducible install from hashed lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests -q
      - run: python -m scripts.build_group_summaries --check
      - run: python scripts/build_figures.py --check
      - run: python -m scripts.build_recording_figures --check
      - run: python -m scripts.build_group_sensitivity --check

  docs:
    name: Build and check documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install mistune==3.3.2
      - run: python scripts/build_docs.py --ref "$GITHUB_SHA"
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload documentation
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: build/docs

  deploy:
    name: Publish documentation
    if: github.ref == 'refs/heads/main'
    needs: [test, locked, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
